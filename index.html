<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which MBTI Type Fits You?</title>
<script>
// 수업용 설정: 문항, 선택지, MBTI 글자, 동점 기준을 이곳에서 수정하세요.
const quiz = {
  pairs: ["EI", "SN", "TF", "JP"],
  tieBreak: "ENFP",
  questions: [
    [["I sometimes make mistakes because I talk too much.","E"],["The people around me sometimes think I’m close-minded because I talk so little.","I"]],
    [["I feel better when I meet a new person.","E"],["I feel tired when I meet a new person.","I"]],
    [["I tend to decide what I will say while talking.","E"],["I tend to think carefully before talking about something.","I"]],
    [["I feel comfortable when I work on a team.","E"],["I feel comfortable when I work with one person or alone.","I"]],
    [["I enjoy expressing my opinion.","E"],["I often keep my opinion to myself.","I"]],
    [["I sometimes regret talking too much after a meeting or gathering is over.","E"],["I sometimes regret not talking much after a meeting or gathering is over.","I"]],
    [["I get bored or feel lonely when I work alone for a long time.","E"],["I don't get bored or feel lonely when I work alone for a long time.","I"]],
    [["Having some background noise sometimes helps me work better.","E"],["I cannot work well in a noisy environment.","I"]],
    [["I talk rather fast and loudly.","E"],["I talk quietly.","I"]],
    [["I’m a pretty active person.","E"],["I feel comfortable when I’m at home.","I"]],

    [["I’m realistic.","S"],["I’m future-oriented.","N"]],
    [["I judge based on past experiences.","S"],["I judge based on the probability in the future.","N"]],
    [["I’m good with reality-based concepts.","S"],["I’m good with abstract concepts.","N"]],
    [["I’m a detailed person.","S"],["I’m a metaphorical person.","N"]],
    [["I’m a sensible person.","S"],["I’m a creative person.","N"]],
    [["I feel comfortable taking routes I’ve taken before.","S"],["I’m interested in taking new and different routes.","N"]],
    [["I am good at housework.","S"],["I am not good at housework.","N"]],
    [["I can remember routes that I have taken before.","S"],["I cannot remember routes that I have taken before.","N"]],
    [["I like actual experiences.","S"],["I like fantasy.","N"]],
    [["I’m more of a calm person.","S"],["I sometimes leap to conclusions.","N"]],

    [["I’m analytic.","T"],["I’m sensitive.","F"]],
    [["I’m objective.","T"],["I’m empathetic.","F"]],
    [["I make decisions aside from my feelings.","T"],["I make decisions by considering the situation.","F"]],
    [["I behave based on my reason and logic.","T"],["I behave based on my values and feelings.","F"]],
    [["I like hearing that I’m skillful.","T"],["I like hearing that I’m a warm person.","F"]],
    [["I’m competitive.","T"],["I’m not competitive.","F"]],
    [["I feel comfortable speaking in a straightforward manner.","T"],["I feel comfortable speaking in a considerate way.","F"]],
    [["I easily understand the cause and effect of events.","T"],["I easily understand how others feel.","F"]],
    [["People usually think of me as a cold person.","T"],["People usually think of me as a warm person.","F"]],
    [["I tell others my honest thoughts and feelings even if it makes them feel uncomfortable.","T"],["I tend to try to think positively.","F"]],

    [["I tend to not change decisions that have already been made.","J"],["I tend to be flexible with decisions that have already been made.","P"]],
    [["I work according to the schedule.","J"],["I tend to procrastinate.","P"]],
    [["I prefer to go on a pre-planned trip.","J"],["I prefer to go on a spontaneous trip.","P"]],
    [["I prefer to work on a team.","J"],["I prefer to work alone.","P"]],
    [["I like to suggest my opinion or position clearly.","J"],["I regard my views as temporary.","P"]],
    [["I work well in a systematic atmosphere.","J"],["I work well in a pleasant atmosphere.","P"]],
    [["I’m premeditated and systematic.","J"],["I react quickly to situations.","P"]],
    [["I like abiding to norms.","J"],["I like being free.","P"]],
    [["I become closer to people when I work with them.","J"],["I become closer to people when I play with them.","P"]],
    [["My desk is organized.","J"],["My desk is messy.","P"]]
  ]
};
</script>
<style>
@import url("https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap");

:root {
  --cork: #c69c6d;
  --ink: #2a2522;
  --yellow: #fff27a;
  --pink: #ffc2d1;
  --green: #c8f3a6;
  --blue: #bfe3ff;
  --orange: #ffd3a1;
  --paper: #fffdf5;
  --pin: #e5484d;
  --shadow: 0 6px 10px -4px rgba(0, 0, 0, .35);
  --page-font: "Gaegu", "Segoe Print", "Malgun Gothic", cursive;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding: clamp(32px, 7vw, 80px) clamp(12px, 5vw, 24px);
  background-color: var(--cork);
  background-image:
    radial-gradient(color-mix(in srgb, var(--ink) 28%, transparent) 1px, transparent 1.4px),
    radial-gradient(color-mix(in srgb, var(--paper) 35%, transparent) 1px, transparent 1.6px);
  background-size: 7px 7px, 11px 11px;
  color: var(--ink);
  font: 400 17px/1.6 var(--page-font);
  word-break: keep-all;
  overflow-wrap: anywhere;
}
main { max-width: 1080px; margin: auto; }
h1, h2, #type, .badge, #previous, caption, tbody th {
  font-family: var(--page-font);
  font-weight: 700;
}

h1, main > p, #activity, #result, button, #review {
  position: relative;
  border-radius: 2px;
  box-shadow: var(--shadow);
}
h1 {
  width: fit-content;
  max-width: 100%;
  margin: 0 0 22px;
  padding: 16px clamp(12px, 4vw, 30px);
  background: var(--yellow);
  font-size: clamp(34px, 8vw, 80px);
  line-height: 1.03;
  transform: rotate(-2deg);
}
h1::before, #result::before {
  content: "";
  position: absolute;
  top: -12px;
  left: 50%;
  width: 110px;
  height: 24px;
  transform: translateX(-50%) rotate(-3deg);
  background: color-mix(in srgb, var(--paper) 65%, transparent);
  border-inline: 2px dashed color-mix(in srgb, var(--ink) 18%, transparent);
  pointer-events: none;
}
main > p {
  width: fit-content;
  margin: 0 0 24px;
  padding: 12px 18px;
  background: var(--paper);
  transform: rotate(1deg);
}
#activity, #result {
  margin: 0 0 22px;
  padding: clamp(12px, 3vw, 28px);
  background: var(--paper) repeating-linear-gradient(
    transparent 0 33px, color-mix(in srgb, var(--blue) 48%, transparent) 33px 34px
  );
}
#result { transform: rotate(-.6deg); }
h2 {
  margin: 0 0 12px;
  font-size: clamp(30px, 5vw, 50px);
  line-height: 1.1;
}
#choices {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  margin: 20px 4px 8px;
}
button {
  min-height: 48px;
  border: 0;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
button:not(:disabled):hover { text-decoration: underline; }
button:disabled { opacity: .55; cursor: default; }
button:focus-visible, h2:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 4px;
}
.choice {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 10px;
  align-items: baseline;
  padding: 26px 14px 14px;
  text-align: left;
  background: var(--pink);
  transform: rotate(-1.2deg);
}
.choice:nth-child(2) {
  background: var(--green);
  transform: rotate(1.2deg);
}
.choice::before {
  content: "";
  position: absolute;
  top: 7px;
  left: calc(50% - 6px);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--pink), var(--pin) 50%, var(--ink));
  box-shadow: var(--shadow);
  pointer-events: none;
}
.badge { font-size: 26px; line-height: 1; }
#previous {
  padding: 8px 22px;
  background: var(--blue);
  font-size: 24px;
  transform: rotate(1.5deg);
}
#type {
  margin: 0;
  font-size: clamp(50px, 10vw, 88px);
  line-height: 1;
}
#score {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
  gap: 12px;
  margin-top: 16px;
}
.score-card {
  padding: 10px 14px 14px;
  background: var(--paper);
  border-radius: 2px;
  box-shadow: var(--shadow);
}
.score-labels {
  display: flex;
  justify-content: space-between;
  font-size: 24px;
  font-weight: 700;
}
.score-bar {
  display: flex;
  height: 16px;
  border: 1px solid var(--ink);
  border-radius: 2px;
  overflow: hidden;
}
[data-pair="EI"] { --score-color: var(--pink); }
[data-pair="SN"] { --score-color: var(--blue); }
[data-pair="TF"] { --score-color: var(--yellow); }
[data-pair="JP"] { --score-color: var(--green); }
.score-bar span { flex-basis: 0; background: #e5e5e5; }
.score-bar span:not([hidden]) + span:not([hidden]) { border-left: 1px solid var(--ink); }
.score-bar span.majority { background: var(--score-color); }
#review {
  width: 100%;
  margin-top: 28px;
  padding: 4px 8px 8px;
  background: var(--paper);
  border-spacing: 5px 8px;
  table-layout: fixed;
}
caption {
  padding: 4px 12px;
  background: var(--orange);
  text-align: left;
  font-size: clamp(25px, 4vw, 34px);
}
th, td { padding: 6px; text-align: left; vertical-align: top; }
thead th { font-size: 15px; }
thead th:first-child { width: 3rem; }
tbody th { font-size: 24px; white-space: nowrap; }
td { background: #e5e5e5; }
td.selected { background: var(--score-color); }

main > p, .choice { font-size: 25.5px; }
#question { font-size: clamp(45px, 7.5vw, 75px); }

@media (max-width: 760px) {
  #choices { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<main>
  <h1>Which MBTI Type Fits You?</h1>
  <p>Read both statements. Choose the one that sounds more like you.</p>
  <section id="activity">
    <h2 id="question" tabindex="-1"></h2>
    <div id="choices"></div>
  </section>
  <section id="result" hidden>
    <h2 id="result-title" tabindex="-1">Your classroom quiz result</h2>
    <p id="type"></p>
    <div id="score"></div>
  </section>
  <button id="previous" type="button">Previous step</button>
  <table id="review" hidden>
    <caption>Review the statements</caption>
    <thead><tr><th scope="col">No.</th><th scope="col">Choice A</th><th scope="col">Choice B</th></tr></thead>
    <tbody></tbody>
  </table>
</main>
<script>
const activity = document.querySelector("#activity");
const question = document.querySelector("#question");
const choices = document.querySelector("#choices");
const result = document.querySelector("#result");
const review = document.querySelector("#review");
const previous = document.querySelector("#previous");
const answers = [];


quiz.questions.forEach((options, index) => {
  const row = review.tBodies[0].insertRow();
  row.dataset.pair = quiz.pairs.find(pair => pair.includes(options[0][1]));
  const number = document.createElement("th");
  number.scope = "row";
  number.textContent = index + 1;
  row.append(number);

  options.forEach(([statement, letter]) => {
    const cell = row.insertCell();
    const label = document.createElement("strong");
    label.textContent = letter;
    cell.append(label, document.createElement("br"), statement);
  });
});

function showQuestion() {
  const index = answers.length;
  previous.disabled = index === 0;
  question.textContent = `Question ${index + 1} of ${quiz.questions.length}`;
  choices.replaceChildren();

  quiz.questions[index].forEach(([statement, letter], optionIndex) => {
    const button = document.createElement("button");
    const badge = document.createElement("span");
    button.type = "button";
    button.className = "choice";
    badge.className = "badge";
    badge.textContent = ["A", "B"][optionIndex];
    button.append(badge, statement);
    button.addEventListener("click", () => {
      answers.push(letter);
      if (answers.length === quiz.questions.length) {
        showResult();
      } else {
        showQuestion();
        question.focus();
      }
    });
    choices.append(button);
  });
}

function showResult() {
  const totals = Object.fromEntries([...quiz.pairs.join("")].map(letter => [letter, 0]));
  answers.forEach((letter, index) => {
    totals[letter]++;
    const row = review.tBodies[0].rows[index];
    quiz.questions[index].forEach(([, optionLetter], optionIndex) => {
      row.cells[optionIndex + 1].classList.toggle("selected", letter === optionLetter);
    });
  });
  const type = quiz.pairs.map(([first, second], index) => {
    if (totals[first] === totals[second]) return quiz.tieBreak[index];
    return totals[first] > totals[second] ? first : second;
  }).join("");

  document.querySelector("#type").textContent = type;
  const score = document.querySelector("#score");
  score.replaceChildren();
  quiz.pairs.forEach(pair => {
    const card = document.createElement("div");
    const labels = document.createElement("div");
    const bar = document.createElement("div");
    card.className = "score-card";
    card.dataset.pair = pair;
    labels.className = "score-labels";
    bar.className = "score-bar";
    bar.setAttribute("aria-hidden", "true");

    const highest = Math.max(...[...pair].map(letter => totals[letter]));
    const tied = totals[pair[0]] === totals[pair[1]];
    for (const letter of pair) {
      const label = document.createElement("span");
      const segment = document.createElement("span");
      label.textContent = `${letter} ${totals[letter]}`;
      segment.style.flexGrow = totals[letter];
      segment.hidden = totals[letter] === 0;
      segment.classList.toggle("majority", !tied && totals[letter] === highest);
      labels.append(label);
      bar.append(segment);
    }

    card.append(labels, bar);
    score.append(card);
  });
  previous.hidden = true;
  activity.hidden = true;
  result.hidden = false;
  review.hidden = false;
  document.querySelector("#result-title").focus();
}

previous.addEventListener("click", () => {
  if (previous.hidden || answers.length === 0) return;
  answers.pop();
  result.hidden = true;
  review.hidden = true;
  activity.hidden = false;
  showQuestion();
  question.focus();
});

showQuestion();
</script>
</body>
</html>
